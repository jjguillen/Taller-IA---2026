<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sky Assault - The Phantom War</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: monospace;
    }
    #game-container {
      border: 2px solid #333;
      box-shadow: 0 0 40px rgba(0, 100, 200, 0.3);
    }
    #game-container canvas {
      display: block;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <!-- Phaser 3 from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>

  <!-- Game scripts loaded in dependency order -->
  <script src="js/config.js"></script>
  <script src="js/data/stages.js"></script>
  <script src="js/entities/entities.js"></script>
  <script src="js/scenes/scenes.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
